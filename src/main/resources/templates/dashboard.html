<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Shop-Floor Andon Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background: #f4f4f4;
      }
      h1 {
        color: #222;
      }
      .summary {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }
      .card {
        padding: 15px 25px;
        border-radius: 6px;
        color: #fff;
        font-weight: bold;
      }
      .open {
        background: #d9534f;
      }
      .inprogress {
        background: #f0ad4e;
      }
      .resolved {
        background: #5cb85c;
      }
      .alerts {
        background: #fff3cd;
        border: 1px solid #ffe08a;
        padding: 10px 15px;
        margin-bottom: 20px;
        border-radius: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: left;
      }
      th {
        background: #333;
        color: #fff;
      }
      .severity-HIGH {
        color: #d9534f;
        font-weight: bold;
      }
      .severity-MEDIUM {
        color: #f0ad4e;
      }
      .severity-LOW {
        color: #5cb85c;
      }
      a.button {
        display: inline-block;
        padding: 8px 16px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        margin-bottom: 15px;
      }
      input[type="text"] {
        padding: 8px;
        width: 250px;
      }
    </style>
  </head>
  <body>
    <h1>Shop-Floor Andon Dashboard</h1>

    <div class="summary">
      <div class="card open">Open: <span th:text="${openCount}">0</span></div>
      <div class="card inprogress">
        In Progress: <span th:text="${inProgressCount}">0</span>
      </div>
      <div class="card resolved">
        Resolved: <span th:text="${resolvedCount}">0</span>
      </div>
    </div>

    <div class="alerts" th:if="${!criticalAlerts.isEmpty()}">
      <strong>&#9888; Critical Alerts (Open + High Severity):</strong>
      <ul>
        <li th:each="alert : ${criticalAlerts}">
          <a
            th:href="@{'/events/' + ${alert.id}}"
            th:text="${alert.station} + ' - ' + ${alert.issueType}"
            >Alert</a
          >
        </li>
      </ul>
    </div>

    <a class="button" th:href="@{/events/new}">+ Log New Event</a>

    <form th:action="@{/events}" method="get" style="margin-bottom: 15px">
      <input
        type="text"
        name="q"
        placeholder="Search station or issue type..."
        th:value="${query}"
      />
      <button type="submit">Search</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Issue Type</th>
          <th>Severity</th>
          <th>Status</th>
          <th>Timestamp</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${events}">
          <td th:text="${e.station}">Station</td>
          <td th:text="${e.issueType}">Issue</td>
          <td th:text="${e.severity}" th:class="'severity-' + ${e.severity}">
            Severity
          </td>
          <td th:text="${e.status}">Status</td>
          <td th:text="${e.timestamp}">Timestamp</td>
          <td><a th:href="@{'/events/' + ${e.id}}">View</a></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
